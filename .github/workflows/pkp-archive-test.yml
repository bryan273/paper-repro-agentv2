# Temporary: checks the archive key end to end with one tiny file. Removed after the check.
name: pkp-archive-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PKP_HOST: ${{ secrets.PKP_HOST }}
      PKP_PORT: ${{ secrets.PKP_PORT }}
      PKP_USER: ${{ secrets.PKP_USER }}
      PKP_KEY: ${{ secrets.PKP_KEY }}
      PKP_HOSTKEY: ${{ secrets.PKP_HOSTKEY }}
    steps:
      - name: Archive path
        run: |
          if [ -z "$PKP_KEY" ]; then echo "RESULT: PKP_KEY is EMPTY"; exit 0; fi
          install -m 700 -d ~/.ssh
          echo "$PKP_KEY" > ~/.ssh/pkp_key && chmod 600 ~/.ssh/pkp_key
          echo "RESULT: key present, derives: $(ssh-keygen -y -f ~/.ssh/pkp_key 2>&1 | cut -c1-60)"
          echo "[$PKP_HOST]:$PKP_PORT $PKP_HOSTKEY" > ~/.ssh/pkp_known_hosts
          SSH="ssh -i $HOME/.ssh/pkp_key -p $PKP_PORT -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/pkp_known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          mkdir -p t/_archive_test && echo "archive test $(date -u +%FT%TZ)" > t/_archive_test/scenes.json
          if rsync -a -e "$SSH" --include='scenes.json' --exclude='*' t/_archive_test/ "$PKP_USER@$PKP_HOST:experiments/paper-explainer/_archive_test/"; then echo "RESULT: rsync upload OK"; else echo "RESULT: rsync upload FAILED"; fi
          if $SSH "$PKP_USER@$PKP_HOST" "ls /" 2>&1 | head -2; then :; fi
          rm -f ~/.ssh/pkp_key
