# Server renderer for Paper Explainer: the explainer-render Supabase function queues a job and dispatches this workflow.
# It writes the script from the paper, checks quotes and numbers, narrates EN and ZH, records the player and uploads the MP4s.
name: explainer-render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: explainer_jobs.id
        required: true
concurrency:
  group: explainer-render-${{ inputs.job_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: explainer
    env:
      SUPABASE_URL: https://vzvyghmtsakixlhzzuol.supabase.co
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
      RKAPI_OPENAI_KEY: ${{ secrets.RKAPI_OPENAI_KEY }}   # gpt-5.6-terra draws the Manim animations
      RKAPI_API_KEY: ${{ secrets.RKAPI_API_KEY }}   # Claude through RKAPI: writes the scripts (Haiku) and the Manim animations (Sonnet)   # the working model provider; gen.py uses it for the DeepSeek models when set
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: explainer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: explainer/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-cjk libcairo2-dev libpango1.0-dev pkg-config
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render
        run: python render_job.py "${{ inputs.job_id }}"
