# Server renderer for Paper Explainer: the explainer-render Supabase function queues a job and dispatches this workflow.
# It writes the script from the paper, checks quotes and numbers, narrates EN and ZH, records the player and uploads the MP4s.
name: explainer-render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: explainer_jobs.id
        required: true
permissions:
  contents: read
concurrency:
  group: explainer-render-${{ inputs.job_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: explainer
    env:
      SUPABASE_URL: https://wzdkroxbfrlqijbeiwpk.supabase.co
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
      RKAPI_OPENAI_KEY: ${{ secrets.RKAPI_OPENAI_KEY }}   # gpt-5.6-terra draws the Manim animations
      RKAPI_API_KEY: ${{ secrets.RKAPI_API_KEY }}   # Claude through RKAPI: writes the scripts (Haiku) and the Manim animations (Sonnet)   # the working model provider; gen.py uses it for the DeepSeek models when set
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: explainer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: explainer/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Base install
        run: |
          # only what writing the script needs (ffmpeg measures the narration); the rest installs in the background
          sudo apt-get install -y -q --no-install-recommends ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          pip install -q edge-tts pillow pymupdf
          chmod +x install_heavy.sh
          setsid nohup ./install_heavy.sh > /dev/null 2>&1 < /dev/null &
      - name: Render
        run: |
          df -h / | tail -1
          python render_job.py "${{ inputs.job_id }}"
      # Optional cold copy of the finished videos on a server with a spare folder. The host, port and key live only in secrets (this repo is
      # public), the step is skipped when they are not set, and a failure here never fails the render: the videos are already in Supabase.
      - name: Archive the finished videos (optional)
        if: success()
        continue-on-error: true
        timeout-minutes: 10
        env:
          PKP_HOST: ${{ secrets.PKP_HOST }}
          PKP_PORT: ${{ secrets.PKP_PORT }}
          PKP_USER: ${{ secrets.PKP_USER }}
          PKP_KEY: ${{ secrets.PKP_KEY }}
          PKP_HOSTKEY: ${{ secrets.PKP_HOSTKEY }}
        run: |
          if [ -z "$PKP_KEY" ] || [ -z "$PKP_HOST" ]; then echo "archive not configured, skipped"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s
' "$PKP_KEY" > ~/.ssh/pkp_key && chmod 600 ~/.ssh/pkp_key
          printf '[%s]:%s %s
' "$PKP_HOST" "$PKP_PORT" "$PKP_HOSTKEY" > ~/.ssh/pkp_known_hosts
          SSH="ssh -i $HOME/.ssh/pkp_key -p $PKP_PORT -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/pkp_known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          for d in out/*/; do
            slug=$(basename "$d")
            rsync -a -e "$SSH" --include='*_en.mp4' --include='*_zh.mp4' --include='*_vertical.mp4' --include='scenes.json' --exclude='*' "$d" "$PKP_USER@$PKP_HOST:experiments/paper-explainer/$slug/"
          done
          shred -u ~/.ssh/pkp_key || rm -f ~/.ssh/pkp_key
