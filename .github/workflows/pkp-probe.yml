# Temporary: checks only whether the archive server's SSH port answers from a GitHub runner (no login). Removed after the check.
name: pkp-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PKP_HOST: ${{ secrets.PKP_HOST }}
      PKP_PORT: ${{ secrets.PKP_PORT }}
      PKP_HOSTKEY: ${{ secrets.PKP_HOSTKEY }}
    steps:
      - name: Probe
        run: |
          if timeout 15 bash -c 'echo > /dev/tcp/$PKP_HOST/$PKP_PORT' 2>/dev/null; then echo "RESULT: port reachable from the runner"; else echo "RESULT: port NOT reachable from the runner"; exit 0; fi
          scan=$(ssh-keyscan -T 10 -p "$PKP_PORT" -t ed25519 "$PKP_HOST" 2>/dev/null | awk '{print $2" "$3}')
          if [ "$scan" = "$PKP_HOSTKEY" ]; then echo "RESULT: ssh answers and the host key matches"; else echo "RESULT: ssh did not return the expected host key"; fi
