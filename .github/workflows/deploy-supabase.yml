# Puts the Supabase edge functions live when a change to them reaches main. Only the functions that changed are deployed
# (all of them when the shared code changes). Database changes (supabase/*.sql) are NOT run here: apply those by hand.
name: deploy-supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every function
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: vzvyghmtsakixlhzzuol

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::notice::SUPABASE_ACCESS_TOKEN is not set in this repo, nothing was deployed."; exit 0; fi
          cd supabase/functions
          all_fns=$(ls -d */ | tr -d / | grep -v '^_')
          if [ "$ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            fns="$all_fns"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- . | cut -d/ -f1 | sort -u)
            if echo "$changed" | grep -qx '_shared'; then fns="$all_fns"; else fns=$(echo "$changed" | grep -v '^_' || true); fi
          fi
          fail=0
          for fn in $fns; do
            [ -f "$fn/index.ts" ] || { echo "skip $fn (removed)"; continue; }
            echo "== deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt || fail=1
          done
          exit $fail
